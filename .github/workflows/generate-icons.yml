name: Generate icon sets

on:
  push:
    branches: [main]
    paths:
      - "Icons/**/*.png"
      - "Icons/**/*.[pP][nN][gG]"
      - ".github/workflows/generate-icons.js"
      - ".github/workflows/generate-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-icons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate category icon sets
        run: node .github/workflows/generate-icons.js
      - name: Commit updated icon sets
        run: |
          git add -- Icons/Flag/icons.json Icons/Shape/icons.json Icons/Mark/icons.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update category icon sets"
          git push origin HEAD:main
